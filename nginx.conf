server {
    listen       8999;
    server_name  localhost;

    location = / { return 302 /frontend/; }
    location = /frontend { return 301 /frontend/; }

    # 对应 Vite base: /frontend/
    location /frontend/ {
        alias   D:/aobo/bigdata/dist/;
        index   index.html;
        try_files $uri $uri/ /frontend/index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}